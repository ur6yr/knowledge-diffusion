[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kdiff-reproduction"
version = "0.2.0"
description = "Bounded AutoGen and Neo4j temporal scientific graph reproduction"
requires-python = ">=3.11,<3.14"
dependencies = [
  "autogen-agentchat==0.7.5",
  "autogen-core==0.7.5",
  "autogen-ext[openai]==0.7.5",
  "neo4j==6.1.0",
  "pydantic==2.13.5",
  "openai==3.17.0",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "ijson==3.5.1",
  "defusedxml==0.7.1",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
papers = ["pymupdf==1.26.7"]

[project.scripts]
kdiff = "kdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdiff = ["prompts/**/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["neo4j: requires the owned isolated development service", "live: requires explicitly authorized live inference"]
